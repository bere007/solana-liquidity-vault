[package]
name = "liquidity-vault"
version = "0.1.0"
description = "Liquidity Vault: каркас DeFi-vault (конфиг, PDA пользователя, share-токен)"
edition = "2021"
rust-version = "1.79"

[lib]
crate-type = ["cdylib", "lib"]
name = "liquidity_vault"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl = []
no-log-ix-name = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "=0.31.1"
anchor-spl = "=0.31.1"
